<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue Record Components</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #0081f7;
      --soft-blue: #78c6ff;
      --white: #f5f9ff;
      --muted: rgba(245, 249, 255, 0.72);
      --track: rgba(255, 255, 255, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--blue);
    }

    body {
      display: grid;
      place-items: center;
      font-family: "Bricolage Grotesque", "Avenir Next", "Helvetica Neue", sans-serif;
    }

    .scene-page {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--blue);
      isolation: isolate;
    }

    .component-stack {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      gap: clamp(26px, 4vh, 42px);
      width: 100%;
      padding-top: clamp(52px, 8vh, 90px);
      pointer-events: none;
    }

    .tilted-card-figure,
    .slider-container {
      pointer-events: auto;
    }

    .tilted-card-figure {
      position: relative;
      width: min(68vw, 340px);
      height: min(68vw, 340px);
      perspective: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .tilted-card-inner {
      position: relative;
      width: min(68vw, 320px);
      height: min(68vw, 320px);
      transform-style: preserve-3d;
      will-change: transform;
    }

    .tilted-card-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0 28px 90px rgba(0, 39, 96, 0.32);
      transform: translateZ(0);
      will-change: transform;
    }

    .tilted-card-noise {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      border-radius: 15px;
      mix-blend-mode: soft-light;
      opacity: 0.46;
      pointer-events: none;
      transform: translateZ(1px);
      image-rendering: pixelated;
    }

    .tilted-card-overlay {
      position: absolute;
      left: 18px;
      bottom: 16px;
      z-index: 2;
      display: grid;
      gap: 4px;
      color: #fff;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.42);
      transform: translateZ(30px);
      will-change: transform;
    }

    .tilted-card-title {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
    }

    .tilted-card-meta {
      margin: 0;
      color: rgba(255, 255, 255, 0.74);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .tilted-card-caption {
      pointer-events: none;
      position: absolute;
      left: 0;
      top: 0;
      z-index: 3;
      padding: 4px 10px;
      border-radius: 4px;
      background-color: #fff;
      color: #2d2d2d;
      font-size: 10px;
      font-weight: 700;
      opacity: 0;
      transform: translate3d(0, 0, 0) rotate(0deg);
      will-change: transform, opacity;
    }

    .slider-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      width: 12rem;
      color: var(--muted);
    }

    .slider-wrapper {
      display: flex;
      width: 100%;
      touch-action: none;
      user-select: none;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      opacity: 0.78;
      transform: scale(1);
      transition:
        opacity 180ms ease,
        transform 260ms cubic-bezier(0.18, 0.9, 0.22, 1.22);
    }

    .slider-wrapper.is-active,
    .slider-wrapper:hover {
      opacity: 1;
      transform: scale(1.12);
    }

    .slider-icon {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      color: rgba(255, 255, 255, 0.74);
      font-size: 19px;
      line-height: 1;
      transform: translateX(0) scale(1);
      transition: transform 220ms ease;
    }

    .slider-icon.is-left {
      transform: translateX(var(--left-icon-x, 0)) scale(var(--left-icon-scale, 1));
    }

    .slider-icon.is-right {
      transform: translateX(var(--right-icon-x, 0)) scale(var(--right-icon-scale, 1));
    }

    .slider-root {
      position: relative;
      display: flex;
      width: 100%;
      max-width: 200px;
      flex-grow: 1;
      cursor: grab;
      touch-action: none;
      user-select: none;
      align-items: center;
      padding: 1rem 0;
    }

    .slider-root:active {
      cursor: grabbing;
    }

    .slider-track-wrapper {
      display: flex;
      flex-grow: 1;
      height: var(--track-height, 6px);
      margin-top: var(--track-margin, 0);
      margin-bottom: var(--track-margin, 0);
      transform:
        scaleX(var(--track-scale-x, 1))
        scaleY(var(--track-scale-y, 1));
      transform-origin: var(--track-origin, center);
      transition:
        height 180ms ease,
        margin 180ms ease,
        transform 520ms cubic-bezier(0.18, 0.9, 0.22, 1.28);
    }

    .slider-wrapper.is-dragging .slider-track-wrapper {
      transition: none;
    }

    .slider-track {
      position: relative;
      height: 100%;
      flex-grow: 1;
      overflow: hidden;
      border-radius: 9999px;
      background-color: var(--track);
    }

    .slider-range {
      position: absolute;
      inset: 0 auto 0 0;
      width: 50%;
      border-radius: 9999px;
      background-color: rgba(255, 255, 255, 0.82);
    }

    .value-indicator {
      position: absolute;
      margin: 0;
      transform: translateY(-1rem);
      color: rgba(255, 255, 255, 0.68);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .torus-stage {
      position: absolute;
      inset: auto 0 0;
      z-index: 1;
      width: 100%;
      height: clamp(150px, 24vh, 250px);
      pointer-events: none;
    }

    .torus-stage canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .scene-page::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 90%;
      z-index: -1;
      width: min(36vw, 360px);
      height: min(18vh, 180px);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.18), transparent 68%);
      filter: blur(28px);
      opacity: 0.52;
    }

    @media (max-width: 640px) {
      .component-stack {
        gap: 24px;
        padding-top: 44px;
      }

      .tilted-card-figure,
      .tilted-card-inner {
        width: min(76vw, 280px);
        height: min(76vw, 280px);
      }

      .tilted-card-caption {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .slider-wrapper,
      .slider-track-wrapper,
      .tilted-card-inner {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="scene-page" aria-label="Blue record component scene">
    <section class="component-stack" aria-label="Interactive music controls">
      <figure class="tilted-card-figure" id="tiltedCard">
        <div class="tilted-card-inner">
          <img class="tilted-card-img" src="assets/背面是我-2000.jpg" alt="背面是我 album cover" />
          <canvas class="tilted-card-noise" id="tiltedCardNoise" aria-hidden="true"></canvas>
          <div class="tilted-card-overlay" aria-hidden="true">
            <p class="tilted-card-title">背面是我</p>
            <p class="tilted-card-meta">Marcus / personal radio</p>
          </div>
        </div>
        <figcaption class="tilted-card-caption">背面是我 - Marcus</figcaption>
      </figure>

      <div class="slider-container">
        <div class="slider-wrapper" id="elasticSlider">
          <span class="slider-icon is-left" aria-hidden="true">−</span>
          <div class="slider-root" id="sliderRoot" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" tabindex="0">
            <div class="slider-track-wrapper">
              <div class="slider-track">
                <div class="slider-range" id="sliderRange"></div>
              </div>
            </div>
          </div>
          <span class="slider-icon is-right" aria-hidden="true">＋</span>
        </div>
        <p class="value-indicator" id="sliderValue">50</p>
      </div>
    </section>

    <div class="torus-stage" id="torusStage"></div>
  </main>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';

    function initTiltedCard() {
      const figure = document.getElementById('tiltedCard');
      const inner = figure?.querySelector('.tilted-card-inner');
      const caption = figure?.querySelector('.tilted-card-caption');
      if (!figure || !inner || !caption) return;

      const state = {
        rotateX: 0,
        rotateY: 0,
        scale: 1,
        captionX: 0,
        captionY: 0,
        captionOpacity: 0,
        captionRotate: 0
      };
      const target = { ...state };
      let lastY = 0;

      function tick() {
        for (const key of Object.keys(state)) {
          state[key] += (target[key] - state[key]) * 0.16;
        }

        inner.style.transform = `rotateX(${state.rotateX}deg) rotateY(${state.rotateY}deg) scale(${state.scale})`;
        caption.style.opacity = state.captionOpacity.toFixed(3);
        caption.style.transform = `translate3d(${state.captionX}px, ${state.captionY}px, 0) rotate(${state.captionRotate}deg)`;
        requestAnimationFrame(tick);
      }

      figure.addEventListener('pointermove', event => {
        const rect = figure.getBoundingClientRect();
        const offsetX = event.clientX - rect.left - rect.width / 2;
        const offsetY = event.clientY - rect.top - rect.height / 2;
        const rotateAmplitude = 14;
        const velocityY = offsetY - lastY;

        target.rotateX = (offsetY / (rect.height / 2)) * -rotateAmplitude;
        target.rotateY = (offsetX / (rect.width / 2)) * rotateAmplitude;
        target.captionX = event.clientX - rect.left;
        target.captionY = event.clientY - rect.top;
        target.captionRotate = -velocityY * 0.6;
        lastY = offsetY;
      });

      figure.addEventListener('pointerenter', () => {
        target.scale = 1.1;
        target.captionOpacity = 1;
      });

      figure.addEventListener('pointerleave', () => {
        target.rotateX = 0;
        target.rotateY = 0;
        target.scale = 1;
        target.captionOpacity = 0;
        target.captionRotate = 0;
      });

      tick();
    }

    function initCardNoise() {
      const canvas = document.getElementById('tiltedCardNoise');
      const card = canvas?.parentElement;
      if (!canvas || !card) return;

      const ctx = canvas.getContext('2d', { alpha: true });
      if (!ctx) return;

      let frame = 0;
      let animationId = 0;
      const patternAlpha = 18;
      const logicalSize = 320;

      function resize() {
        canvas.width = logicalSize;
        canvas.height = logicalSize;
      }

      function drawGrain() {
        const imageData = ctx.createImageData(logicalSize, logicalSize);
        const data = imageData.data;

        for (let index = 0; index < data.length; index += 4) {
          const value = Math.random() * 255;
          data[index] = value;
          data[index + 1] = value;
          data[index + 2] = value;
          data[index + 3] = patternAlpha;
        }

        ctx.putImageData(imageData, 0, 0);
      }

      function loop() {
        if (frame % 2 === 0) drawGrain();
        frame += 1;
        animationId = window.requestAnimationFrame(loop);
      }

      resize();
      loop();
      window.addEventListener('resize', resize);

      return () => {
        window.removeEventListener('resize', resize);
        window.cancelAnimationFrame(animationId);
      };
    }

    function initElasticSlider() {
      const wrapper = document.getElementById('elasticSlider');
      const root = document.getElementById('sliderRoot');
      const range = document.getElementById('sliderRange');
      const valueLabel = document.getElementById('sliderValue');
      const leftIcon = wrapper?.querySelector('.is-left');
      const rightIcon = wrapper?.querySelector('.is-right');
      if (!wrapper || !root || !range || !valueLabel || !leftIcon || !rightIcon) return;

      const maxOverflow = 50;
      let value = 50;
      let pointerId = null;

      function sigmoidOverflow(distance) {
        const normalized = Math.abs(distance) / maxOverflow;
        return Math.sign(distance) * (2 * (1 / (1 + Math.exp(-normalized)) - 0.5) * maxOverflow);
      }

      function setValue(nextValue) {
        value = Math.max(0, Math.min(100, Math.round(nextValue)));
        range.style.width = `${value}%`;
        valueLabel.textContent = String(value);
        root.setAttribute('aria-valuenow', String(value));
      }

      function setElastic(clientX) {
        const rect = root.getBoundingClientRect();
        let overflow = 0;
        let zone = 'middle';

        if (clientX < rect.left) {
          zone = 'left';
          overflow = rect.left - clientX;
        } else if (clientX > rect.right) {
          zone = 'right';
          overflow = clientX - rect.right;
        } else {
          setValue(((clientX - rect.left) / rect.width) * 100);
        }

        const pull = sigmoidOverflow(overflow);
        const scaleX = 1 + pull / rect.width;
        const scaleY = 1 - Math.min(pull / maxOverflow, 1) * 0.2;

        root.style.setProperty('--track-scale-x', scaleX.toFixed(3));
        root.style.setProperty('--track-scale-y', scaleY.toFixed(3));
        root.style.setProperty('--track-origin', zone === 'left' ? 'right' : zone === 'right' ? 'left' : 'center');
        root.style.setProperty('--track-height', wrapper.classList.contains('is-active') ? '12px' : '6px');
        root.style.setProperty('--track-margin', wrapper.classList.contains('is-active') ? '-3px' : '0');
        leftIcon.style.setProperty('--left-icon-x', zone === 'left' ? `${-pull}px` : '0px');
        rightIcon.style.setProperty('--right-icon-x', zone === 'right' ? `${pull}px` : '0px');
        leftIcon.style.setProperty('--left-icon-scale', zone === 'left' && pull > 1 ? '1.32' : '1');
        rightIcon.style.setProperty('--right-icon-scale', zone === 'right' && pull > 1 ? '1.32' : '1');
      }

      function release() {
        pointerId = null;
        wrapper.classList.remove('is-dragging');
        wrapper.classList.remove('is-active');
        root.style.setProperty('--track-scale-x', '1');
        root.style.setProperty('--track-scale-y', '1');
        root.style.setProperty('--track-origin', 'center');
        root.style.setProperty('--track-height', '6px');
        root.style.setProperty('--track-margin', '0');
        leftIcon.style.setProperty('--left-icon-x', '0px');
        rightIcon.style.setProperty('--right-icon-x', '0px');
        leftIcon.style.setProperty('--left-icon-scale', '1');
        rightIcon.style.setProperty('--right-icon-scale', '1');
      }

      wrapper.addEventListener('pointerenter', () => {
        wrapper.classList.add('is-active');
        root.style.setProperty('--track-height', '12px');
        root.style.setProperty('--track-margin', '-3px');
      });

      wrapper.addEventListener('pointerleave', () => {
        if (pointerId === null) release();
      });

      root.addEventListener('pointerdown', event => {
        pointerId = event.pointerId;
        wrapper.classList.add('is-active', 'is-dragging');
        root.setPointerCapture(pointerId);
        setElastic(event.clientX);
      });

      root.addEventListener('pointermove', event => {
        if (pointerId !== event.pointerId) return;
        setElastic(event.clientX);
      });

      root.addEventListener('pointerup', release);
      root.addEventListener('pointercancel', release);
      root.addEventListener('lostpointercapture', release);

      root.addEventListener('keydown', event => {
        if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') {
          setValue(value - 1);
          event.preventDefault();
        }

        if (event.key === 'ArrowRight' || event.key === 'ArrowUp') {
          setValue(value + 1);
          event.preventDefault();
        }

        if (event.key === 'Home') {
          setValue(0);
          event.preventDefault();
        }

        if (event.key === 'End') {
          setValue(100);
          event.preventDefault();
        }
      });

      setValue(value);
    }

    initTiltedCard();
    initCardNoise();
    initElasticSlider();

    const BLUE = new THREE.Color('#0081f7');
    const WHITE = new THREE.Color('#f2f8ff');
    const PALE_BLUE = new THREE.Color('#7fc9ff');
    const stage = document.getElementById('torusStage');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      powerPreference: 'high-performance'
    });
    renderer.setClearColor(BLUE, 1);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = BLUE;

    const camera = new THREE.OrthographicCamera(-2.25, 2.25, 1.7, -1.7, 0.1, 20);
    camera.position.set(0, 0, 7);
    camera.lookAt(0, 0, 0);

    const group = new THREE.Group();
    group.rotation.set(
      THREE.MathUtils.degToRad(230),
      THREE.MathUtils.degToRad(127),
      THREE.MathUtils.degToRad(180)
    );
    scene.add(group);

    const geometry = new THREE.TorusGeometry(1.12, 0.22, 80, 220);

    const vertexShader = `
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vViewPosition;

      void main() {
        vUv = uv;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vNormal = normalize(normalMatrix * normal);
        vViewPosition = -mvPosition.xyz;
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const fragmentShader = `
      precision highp float;

      uniform vec3 uColor;
      uniform vec3 uBlue;
      uniform float uOpacity;
      uniform float uTime;
      uniform float uGhost;
      uniform float uPixelSize;

      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vViewPosition;

      float crossPattern(vec2 screenPosition) {
        vec2 cell = fract(screenPosition / uPixelSize);
        vec2 centered = cell - 0.5;
        vec2 local = abs(centered);
        float diagA = abs(centered.x - centered.y);
        float diagB = abs(centered.x + centered.y);
        float stroke = 1.0 - smoothstep(0.055, 0.12, min(diagA, diagB));
        float size = 1.0 - smoothstep(0.32, 0.44, max(local.x, local.y));
        return stroke * size;
      }

      void main() {
        vec3 normal = normalize(vNormal);
        vec3 viewDir = normalize(vViewPosition);
        float fresnel = pow(1.0 - abs(dot(normal, viewDir)), 0.82);

        vec2 drift = vec2(sin(uTime * 0.42), cos(uTime * 0.31)) * 1.4;
        float pattern = crossPattern(gl_FragCoord.xy + drift);
        float softBody = 0.16 + fresnel * 0.68;
        float alpha = (pattern * (0.74 + fresnel * 0.92) + softBody * uGhost) * uOpacity;

        vec3 color = mix(uBlue, uColor, 0.66 + fresnel * 0.34);
        color += vec3(fresnel * 0.18);

        gl_FragColor = vec4(color, alpha);
      }
    `;

    function makeMaterial(color, opacity, ghost = 0) {
      return new THREE.ShaderMaterial({
        vertexShader,
        fragmentShader,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        uniforms: {
          uColor: { value: color },
          uBlue: { value: BLUE },
          uOpacity: { value: opacity },
          uTime: { value: 0 },
          uGhost: { value: ghost },
          uPixelSize: { value: 7.4 }
        }
      });
    }

    const backGhost = new THREE.Mesh(geometry, makeMaterial(PALE_BLUE, 0.34, 0.86));
    backGhost.position.set(0.085, -0.052, -0.08);
    backGhost.scale.setScalar(1.015);
    group.add(backGhost);

    const blueCore = new THREE.Mesh(geometry, makeMaterial(PALE_BLUE, 0.28, 0.6));
    blueCore.position.set(0.028, -0.016, -0.035);
    blueCore.scale.setScalar(0.992);
    group.add(blueCore);

    const mainRing = new THREE.Mesh(geometry, makeMaterial(WHITE, 1.18, 0.06));
    group.add(mainRing);

    group.position.set(0, -2.22, 0);

    const clock = new THREE.Clock();

    function resize() {
      const { width, height } = stage.getBoundingClientRect();
      renderer.setSize(width, height, false);
      const aspect = width / Math.max(height, 1);
      const viewHeight = width < 520 ? 9.2 : 9.1;
      const viewWidth = viewHeight * aspect;
      camera.left = -viewWidth / 2;
      camera.right = viewWidth / 2;
      camera.top = viewHeight / 2;
      camera.bottom = -viewHeight / 2;
      camera.updateProjectionMatrix();
    }

    function render() {
      const elapsed = clock.getElapsedTime();

      if (!reduceMotion) {
        group.rotation.x = THREE.MathUtils.degToRad(230) + elapsed * 0.95;
        group.rotation.y = THREE.MathUtils.degToRad(127) + Math.sin(elapsed * 0.42) * 0.18;
        group.rotation.z = THREE.MathUtils.degToRad(180) + elapsed * 0.16;
      }

      for (const mesh of [backGhost, blueCore, mainRing]) {
        mesh.material.uniforms.uTime.value = elapsed;
      }

      renderer.render(scene, camera);
      window.requestAnimationFrame(render);
    }

    resize();
    render();
    window.addEventListener('resize', resize);
  </script>
</body>
</html>
