<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <title>Radio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --ink: #f5f1e8;
      --muted: rgba(245, 241, 232, 0.58);
      --line: rgba(245, 241, 232, 0.14);
      --card: rgba(255, 255, 255, 0.055);
      --radius: 22px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    @property --glow-angle {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }

    @property --glow-opacity {
      syntax: "<percentage>";
      inherits: false;
      initial-value: 0%;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.11), transparent 24rem),
        radial-gradient(circle at 78% 18%, rgba(217, 137, 74, 0.16), transparent 26rem),
        linear-gradient(180deg, #0a0a0a, #020202 68%);
      color: var(--ink);
      font-family: "Avenir Next", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(rgba(255, 255, 255, 0.18) 0.45px, transparent 0.75px),
        radial-gradient(rgba(0, 0, 0, 0.58) 0.45px, transparent 0.8px);
      background-position: 0 0, 1.4px 1.8px;
      background-size: 3.4px 3.4px, 4.2px 4.2px;
      mix-blend-mode: soft-light;
      opacity: 0.32;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .radio-index {
      position: relative;
      z-index: 1;
      display: grid;
      min-height: 100dvh;
      place-content: center;
      width: min(100% - clamp(28px, 7vw, 96px), 1180px);
      margin: 0 auto;
      padding: clamp(32px, 7vh, 74px) 0 clamp(34px, 7vh, 72px);
    }

    .chroma-grid {
      --grid-x: 50%;
      --grid-y: 50%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 360px));
      gap: clamp(14px, 2vw, 22px);
      justify-content: center;
      width: 100%;
      position: relative;
    }

    .chroma-card {
      --spotlight-x: 50%;
      --spotlight-y: 50%;
      --spotlight-opacity: 0;
      --chroma-opacity: 0;
      --glow-opacity: 0%;
      position: relative;
      min-height: clamp(360px, 48vw, 520px);
      overflow: hidden;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background:
        linear-gradient(var(--card), var(--card)) padding-box,
        conic-gradient(
          from var(--glow-angle),
          rgba(245, 241, 232, 0.13) 0deg,
          rgba(245, 241, 232, 0.13) 42deg,
          color-mix(in srgb, rgba(217, 137, 74, 0.95) var(--glow-opacity), rgba(245, 241, 232, 0.13)) 86deg,
          color-mix(in srgb, rgba(255, 233, 184, 0.95) var(--glow-opacity), rgba(245, 241, 232, 0.13)) 112deg,
          color-mix(in srgb, rgba(136, 183, 205, 0.92) var(--glow-opacity), rgba(245, 241, 232, 0.13)) 146deg,
          rgba(245, 241, 232, 0.13) 190deg,
          rgba(245, 241, 232, 0.13) 252deg,
          color-mix(in srgb, rgba(217, 137, 74, 0.78) var(--glow-opacity), rgba(245, 241, 232, 0.13)) 304deg,
          rgba(245, 241, 232, 0.13) 360deg
        ) border-box;
      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      isolation: isolate;
      transform: translateY(0);
      transition:
        --glow-opacity 240ms ease,
        transform 360ms var(--ease),
        border-color 260ms ease,
        box-shadow 360ms var(--ease);
    }

    .chroma-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      background: radial-gradient(
        circle at var(--spotlight-x) var(--spotlight-y),
        rgba(255, 255, 255, 0.22),
        rgba(255, 255, 255, 0.06) 23%,
        transparent 58%
      );
      opacity: var(--spotlight-opacity);
      transition: opacity 240ms ease;
      pointer-events: none;
    }

    .chroma-card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 5;
      padding: 1px;
      border-radius: inherit;
      background:
        conic-gradient(
          from var(--glow-angle),
          transparent 0deg,
          transparent 64deg,
          rgba(245, 241, 232, 0.34) 92deg,
          rgba(217, 137, 74, 0.9) 124deg,
          rgba(136, 183, 205, 0.82) 148deg,
          rgba(245, 241, 232, 0.28) 176deg,
          transparent 220deg,
          transparent 360deg
        );
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      mask-composite: exclude;
      opacity: 0.72;
      filter:
        drop-shadow(0 0 8px rgba(217, 137, 74, 0.42))
        drop-shadow(0 0 18px rgba(136, 183, 205, 0.26));
      opacity: 0;
      pointer-events: none;
    }

    .chroma-card:hover,
    .chroma-card:focus-visible {
      border-color: rgba(245, 241, 232, 0.28);
      box-shadow:
        0 34px 96px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      outline: none;
      transform: translateY(-8px);
    }

    .chroma-card.is-edge-hot,
    .chroma-card:focus-visible {
      box-shadow:
        0 34px 96px rgba(0, 0, 0, 0.55),
        0 0 18px rgba(217, 137, 74, 0.18),
        0 0 36px rgba(136, 183, 205, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      animation: border-glow-spin 4.2s linear infinite;
    }

    .chroma-card.is-edge-hot::after,
    .chroma-card:focus-visible::after {
      opacity: 1;
      filter:
        drop-shadow(0 0 8px rgba(217, 137, 74, 0.46))
        drop-shadow(0 0 22px rgba(136, 183, 205, 0.3));
      animation: border-glow-spin 4.2s linear infinite;
    }

    .chroma-card:hover {
      --spotlight-opacity: 1;
      --chroma-opacity: 1;
    }

    .cover-layer,
    .cover-layer img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .cover-layer {
      z-index: 0;
      overflow: hidden;
    }

    .cover-layer img {
      object-fit: cover;
      transform: scale(1.045);
    }

    .cover-mono img {
      filter: grayscale(1) contrast(1.08) brightness(0.62);
    }

    .cover-color {
      opacity: var(--chroma-opacity);
      -webkit-mask-image: radial-gradient(
        circle 230px at var(--spotlight-x) var(--spotlight-y),
        #000 0%,
        rgba(0, 0, 0, 0.88) 34%,
        transparent 72%
      );
      mask-image: radial-gradient(
        circle 230px at var(--spotlight-x) var(--spotlight-y),
        #000 0%,
        rgba(0, 0, 0, 0.88) 34%,
        transparent 72%
      );
      transition: opacity 260ms ease;
    }

    .cover-color img {
      filter: saturate(1.06) contrast(1.02) brightness(0.86);
    }

    .card-shade {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.2) 42%, rgba(0, 0, 0, 0.82)),
        radial-gradient(circle at 50% 15%, transparent, rgba(0, 0, 0, 0.48) 78%);
      pointer-events: none;
    }

    .card-content {
      position: relative;
      z-index: 2;
      display: grid;
      min-height: inherit;
      align-content: end;
      gap: 18px;
      padding: 22px;
    }

    .track-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: rgba(245, 241, 232, 0.62);
      font-family: "Azeret Mono", "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .card-title {
      display: block;
      margin: 0;
      font-size: clamp(27px, 3vw, 42px);
      font-weight: 760;
      line-height: 0.96;
      letter-spacing: 0;
    }

    .card-artist {
      display: block;
      margin: 0;
      margin-top: 8px;
      color: rgba(245, 241, 232, 0.66);
      font-size: 13px;
      font-weight: 560;
    }

    .open-mark {
      display: inline-grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgba(245, 241, 232, 0.22);
      border-radius: 50%;
      background: rgba(245, 241, 232, 0.08);
      color: var(--ink);
      font-size: 20px;
      transform: translateY(10px);
      opacity: 0;
      transition:
        transform 320ms var(--ease),
        opacity 260ms ease,
        background 260ms ease;
    }

    .chroma-card:hover .open-mark,
    .chroma-card:focus-visible .open-mark {
      opacity: 1;
      transform: translateY(0);
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes border-glow-spin {
      to {
        --glow-angle: 360deg;
      }
    }

    @media (max-width: 1060px) {
      .chroma-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .chroma-card {
        min-height: clamp(320px, 56vw, 480px);
      }
    }

    @media (max-width: 700px) {
      .radio-index {
        width: min(100% - 22px, 1180px);
        padding-top: 28px;
      }

      .chroma-grid {
        grid-template-columns: 1fr;
      }

      .chroma-card {
        min-height: 420px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="radio-index">
    <section class="chroma-grid" id="chromaGrid" aria-label="节目入口"></section>
    <span class="sr-only" id="statusText" aria-live="polite"></span>
  </main>

  <script src="./playlist.js"></script>
  <script>
    const grid = document.getElementById('chromaGrid');
    const statusText = document.getElementById('statusText');
    const episodes = Array.isArray(window.PLAYLIST) ? window.PLAYLIST : [];
    const programs = [
      {
        title: 'EPISODE 1',
        cover: episodes[0]?.cover || 'assets/背面是我-2000.jpg',
        href: 'unicorn.html',
      },
    ];
    const pointerRadius = 360;

    function formatDuration(seconds) {
      const safeSeconds = Number.isFinite(seconds) && seconds > 0 ? seconds : 0;
      const minutes = Math.floor(safeSeconds / 60);
      const rest = Math.floor(safeSeconds % 60);
      return `${minutes}:${String(rest).padStart(2, '0')}`;
    }

    function cardTemplate(program, index) {
      const label = program.title || `EPISODE ${index + 1}`;
      return `
        <a class="chroma-card" href="${program.href}" data-index="${index}" aria-label="打开 ${label}">
          <span class="cover-layer cover-mono" aria-hidden="true">
            <img src="${program.cover}" alt="" loading="eager" />
          </span>
          <span class="cover-layer cover-color" aria-hidden="true">
            <img src="${program.cover}" alt="" loading="eager" />
          </span>
          <span class="card-shade" aria-hidden="true"></span>
          <span class="card-content">
            <span class="card-bottom">
              <span class="track-line">${label}</span>
              <span class="open-mark" aria-hidden="true">›</span>
            </span>
          </span>
        </a>
      `;
    }

    function renderGrid() {
      grid.innerHTML = programs.map(cardTemplate).join('');
    }

    function updateCardLight(event) {
      const cards = grid.querySelectorAll('.chroma-card');
      cards.forEach((card) => {
        const rect = card.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        const dx = Math.max(0, Math.abs(x - rect.width / 2) - rect.width / 2);
        const dy = Math.max(0, Math.abs(y - rect.height / 2) - rect.height / 2);
        const distance = Math.hypot(dx, dy);
        const intensity = Math.max(0, 1 - distance / pointerRadius);
        const inside = x >= 0 && x <= rect.width && y >= 0 && y <= rect.height;
        const edgeDistance = Math.min(x, y, rect.width - x, rect.height - y);
        const edgeIntensity = inside ? Math.max(0, 1 - edgeDistance / 42) : 0;

        card.style.setProperty('--spotlight-x', `${x}px`);
        card.style.setProperty('--spotlight-y', `${y}px`);
        card.style.setProperty('--chroma-opacity', String(Math.min(1, intensity * 0.92)));
        card.style.setProperty('--spotlight-opacity', String(Math.min(1, intensity * 0.7)));
        card.style.setProperty('--glow-opacity', `${Math.round(edgeIntensity * 100)}%`);
        card.classList.toggle('is-edge-hot', edgeIntensity > 0);
      });
    }

    function clearCardLight() {
      grid.querySelectorAll('.chroma-card').forEach((card) => {
        card.style.setProperty('--chroma-opacity', '0');
        card.style.setProperty('--spotlight-opacity', '0');
        card.style.setProperty('--glow-opacity', '0%');
        card.classList.remove('is-edge-hot');
      });
    }

    renderGrid();

    grid.addEventListener('pointermove', updateCardLight);
    grid.addEventListener('pointerleave', clearCardLight);
    grid.addEventListener('focusin', (event) => {
      const card = event.target.closest('.chroma-card');
      if (!card) return;
      card.style.setProperty('--spotlight-x', '50%');
      card.style.setProperty('--spotlight-y', '42%');
      card.style.setProperty('--chroma-opacity', '1');
      card.style.setProperty('--spotlight-opacity', '1');
      card.style.setProperty('--glow-opacity', '100%');
    });
    grid.addEventListener('focusout', clearCardLight);
    grid.addEventListener('click', (event) => {
      const card = event.target.closest('.chroma-card');
      if (!card) return;
      const program = programs[Number(card.dataset.index)];
      statusText.textContent = program ? `正在打开 ${program.title}` : '正在打开播放器';
    });
  </script>
</body>
</html>
