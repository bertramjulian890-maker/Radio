<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <title>Personal Radio</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f4ef;
      --paper-deep: #ebe7dc;
      --ink: #151515;
      --ink-soft: rgba(21, 21, 21, 0.58);
      --ink-faint: rgba(21, 21, 21, 0.32);
      --line: rgba(21, 21, 21, 0.12);
      --seal: rgba(214, 213, 207, 0.82);
      --seal-strong: rgba(188, 186, 179, 0.72);
      --cover-size: clamp(300px, 52vmin, 560px);
      --cover-radius: clamp(22px, 4vw, 30px);
      --seal-height: clamp(46px, 6.4vw, 62px);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-in-out: cubic-bezier(0.83, 0, 0.17, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #000;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--ink);
      background: #000;
      font-family: "Avenir Next", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: none;
    }

    button {
      border: 0;
      color: inherit;
      font: inherit;
    }

    .music-home {
      position: relative;
      display: flex;
      min-height: 100dvh;
      flex-direction: column;
      align-items: center;
      width: min(100% - clamp(18px, 7vw, 72px), 1040px);
      min-height: calc(100dvh - clamp(18px, 7vw, 72px));
      margin: clamp(9px, 3.5vw, 36px) auto;
      padding: clamp(36px, 7vh, 68px) clamp(18px, 5vw, 72px) clamp(36px, 7vh, 68px);
      border-radius: clamp(28px, 5vw, 40px);
      background: #fbfaf7;
      isolation: isolate;
    }

    .stage {
      position: relative;
      z-index: 1;
      display: grid;
      flex: 1;
      width: 100%;
      place-items: center;
      overflow: visible;
    }

    .album-shell {
      display: grid;
      width: 100%;
      max-width: var(--cover-size);
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      justify-items: center;
      gap: 24px;
      transform: translateY(0);
      transition:
        max-width 560ms var(--ease-out),
        grid-template-columns 560ms var(--ease-out),
        gap 560ms var(--ease-out),
        transform 720ms cubic-bezier(0.18, 1.26, 0.34, 1);
    }

    .music-home[data-state="open"] .album-shell {
      position: absolute;
      inset: 0;
      max-width: var(--cover-size);
      grid-template-columns: minmax(0, 1fr);
      gap: 24px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(clamp(-34px, -5vh, -22px)) scale(0.96);
    }

    .music-home[data-state="open"] {
      width: 100%;
      min-height: 100dvh;
      margin: 0;
      padding: 0;
      border-radius: 0;
    }

    .cover-column {
      display: grid;
      width: min(100%, var(--cover-size));
      place-items: center;
      perspective: 900px;
      transition: transform 560ms var(--ease-out);
    }

    .album-unwrapper {
      position: relative;
      display: block;
      width: var(--cover-size);
      max-width: 100%;
      aspect-ratio: 1;
      padding: 0;
      cursor: pointer;
      touch-action: manipulation;
      background: transparent;
      outline: none;
      transform: translateZ(0);
      transform-origin: center center;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .album-unwrapper::after {
      content: "";
      position: absolute;
      inset: -10px;
      border: 1px solid transparent;
      border-radius: calc(var(--cover-radius) + 10px);
      pointer-events: none;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    .album-unwrapper:focus-visible::after {
      border-color: rgba(21, 21, 21, 0.42);
      box-shadow: 0 0 0 6px rgba(21, 21, 21, 0.08);
    }

    .album-cover {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: var(--cover-radius);
      background: #171717;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      box-shadow:
        0 24px 74px rgba(60, 49, 35, 0.18),
        0 3px 0 rgba(255, 255, 255, 0.8) inset,
        0 0 0 1px rgba(21, 21, 21, 0.08);
      transition:
        box-shadow 560ms var(--ease-out),
        filter 560ms var(--ease-out);
    }

    .music-home[data-state="open"] .album-cover {
      box-shadow:
        0 28px 82px rgba(60, 49, 35, 0.22),
        0 3px 0 rgba(255, 255, 255, 0.72) inset,
        0 0 0 1px rgba(21, 21, 21, 0.09);
    }

    .album-cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.005);
      filter: saturate(0.96) contrast(0.985) brightness(1.01);
      transition: filter 540ms var(--ease-out), transform 540ms var(--ease-out);
      position: relative;
      z-index: 0;
    }

    .album-cover::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
    }

    .album-cover::before {
      content: none;
    }

    .plastic-shell {
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      border-radius: inherit;
      pointer-events: none;
      opacity: 1;
      transform: translateZ(0.01px);
      transform-style: preserve-3d;
      transition: opacity 420ms ease;
      will-change: opacity;
    }

    .plastic-film {
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: inherit;
      background:
        linear-gradient(180deg, rgba(248, 248, 246, 0.07), rgba(248, 248, 246, 0.018)),
        radial-gradient(120% 88% at 18% 8%, rgba(255, 255, 255, 0.11), transparent 58%),
        radial-gradient(90% 70% at 82% 92%, rgba(255, 255, 255, 0.06), transparent 62%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.11),
        inset 0 -1px 0 rgba(255, 255, 255, 0.05);
      opacity: 0.58;
      pointer-events: none;
    }

    .plastic-film::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-radial-gradient(circle at 17% 24%, rgba(255, 255, 255, 0.05) 0 0.6px, transparent 0.7px 3px),
        repeating-radial-gradient(circle at 72% 68%, rgba(255, 255, 255, 0.035) 0 0.5px, transparent 0.6px 2.6px);
      mix-blend-mode: soft-light;
      opacity: 0.38;
    }

    .plastic-film::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(128deg, transparent 36%, rgba(255, 255, 255, 0.09) 47%, rgba(255, 255, 255, 0.03) 54%, transparent 66%);
      mix-blend-mode: soft-light;
      opacity: 0.42;
    }

    .plastic-half {
      position: absolute;
      left: 0;
      right: 0;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(248, 248, 246, 0.07), rgba(248, 248, 246, 0.018)),
        radial-gradient(120% 88% at 18% 8%, rgba(255, 255, 255, 0.11), transparent 58%),
        radial-gradient(90% 70% at 82% 92%, rgba(255, 255, 255, 0.06), transparent 62%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.11),
        inset 0 -1px 0 rgba(255, 255, 255, 0.05);
      opacity: 0;
      transform: translate3d(0, 0, 0);
      will-change: transform, opacity, clip-path;
    }

    .plastic-half::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-radial-gradient(circle at 17% 24%, rgba(255, 255, 255, 0.05) 0 0.6px, transparent 0.7px 3px),
        repeating-radial-gradient(circle at 72% 68%, rgba(255, 255, 255, 0.035) 0 0.5px, transparent 0.6px 2.6px);
      mix-blend-mode: soft-light;
      opacity: 0.38;
      pointer-events: none;
    }

    .plastic-half::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(128deg, transparent 36%, rgba(255, 255, 255, 0.09) 47%, rgba(255, 255, 255, 0.03) 54%, transparent 66%);
      mix-blend-mode: soft-light;
      opacity: 0.42;
      pointer-events: none;
    }

    .plastic-half--top {
      top: 0;
      height: calc(50% + (var(--seal-height) * 0.42));
      border-radius: var(--cover-radius) var(--cover-radius) 0 0;
    }

    .plastic-half--bottom {
      bottom: 0;
      height: calc(50% + (var(--seal-height) * 0.42));
      border-radius: 0 0 var(--cover-radius) var(--cover-radius);
    }

    .plastic-half--bottom::after {
      background:
        linear-gradient(212deg, transparent 34%, rgba(255, 255, 255, 0.07) 46%, rgba(255, 255, 255, 0.02) 55%, transparent 68%);
      opacity: 0.36;
    }

    .album-cover::after {
      z-index: 1;
      opacity: 0;
      background:
        radial-gradient(rgba(255, 255, 255, 0.34) 0.42px, transparent 0.74px),
        radial-gradient(rgba(0, 0, 0, 0.32) 0.46px, transparent 0.78px),
        radial-gradient(rgba(255, 255, 255, 0.16) 0.35px, transparent 0.68px);
      background-position: 0 0, 1.2px 1.7px, 2.4px 0.6px;
      background-size: 2.2px 2.2px, 2.8px 2.8px, 3.7px 3.7px;
      mix-blend-mode: soft-light;
      transition: opacity 520ms var(--ease-out);
    }

    .music-home[data-state="revealed"] .album-cover img,
    .music-home[data-state="open"] .album-cover img {
      filter: saturate(0.97) contrast(1) brightness(1.005);
    }

    .music-home[data-state="revealed"] .plastic-shell,
    .music-home[data-state="open"] .plastic-shell {
      opacity: 0;
    }

    .music-home[data-state="revealed"] .album-cover::after,
    .music-home[data-state="open"] .album-cover::after {
      opacity: 0.48;
    }

    .seal {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      z-index: 3;
      display: block;
      height: var(--seal-height);
      transform: translate3d(0, -50%, 0);
      transform-origin: center center;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(244, 246, 250, 0.12), rgba(250, 251, 253, 0.34) 34%, rgba(238, 242, 248, 0.28) 68%, rgba(244, 246, 250, 0.12));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.34),
        inset 0 -1px 0 rgba(255, 255, 255, 0.14),
        0 0 0 1px rgba(255, 255, 255, 0.08);
      will-change: transform, opacity, clip-path;
    }

    .seal::before,
    .seal::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.42) 18%, rgba(255, 255, 255, 0.42) 82%, transparent);
      opacity: 0.72;
      pointer-events: none;
    }

    .seal::before {
      top: 0;
    }

    .seal::after {
      bottom: 0;
    }

    .music-home.is-unwrapping .album-unwrapper {
      animation: unwrap-cover 1650ms both;
    }

    .music-home.is-unwrapping .album-cover {
      animation: cover-shadow 1650ms both;
    }

    .music-home[data-state="peeling"] .plastic-film {
      opacity: 0;
    }

    .music-home[data-state="peeling"] .plastic-half--top,
    .music-home[data-state="peeling"] .plastic-half--bottom {
      opacity: 0.58;
    }

    .music-home[data-state="peeling"] .plastic-half--top {
      animation: film-top-lift 1180ms 120ms var(--ease-in-out) both;
    }

    .music-home[data-state="peeling"] .plastic-half--bottom {
      animation: film-bottom-lift 1180ms 120ms var(--ease-in-out) both;
    }

    .music-home[data-state="peeling"] .seal {
      animation: seal-open 980ms 180ms var(--ease-in-out) forwards;
    }

    .music-home[data-state="revealed"] .seal,
    .music-home[data-state="open"] .seal {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .content-column {
      width: 100%;
      max-width: min(100%, var(--cover-size));
      text-align: center;
      transition:
        max-width 520ms var(--ease-out),
        text-align 520ms var(--ease-out),
        transform 520ms var(--ease-out);
    }

    .music-home[data-state="open"] .content-column {
      max-width: min(100%, var(--cover-size));
      text-align: left;
      transform: translateY(0);
    }

    .liquid-page {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 0;
      opacity: 0;
      pointer-events: none;
      transform: translateY(28px) scale(0.985);
      transition:
        opacity 640ms ease,
        transform 760ms cubic-bezier(0.18, 1, 0.34, 1);
    }

    .music-home[data-state="open"] .liquid-page {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
      transition-delay: 90ms;
    }

    .liquid-page:focus {
      outline: none;
    }

    .unicorn-scene {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
    }

    .album-details {
      display: grid;
      gap: 14px;
      transform: translateY(0);
      transition: transform 720ms cubic-bezier(0.18, 1.26, 0.34, 1);
    }

    .music-home[data-state="open"] .album-details {
      transform: translateY(6px);
    }

    .meta-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      color: var(--ink-soft);
      font-size: clamp(14px, 2vw, 19px);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: justify-content 520ms var(--ease-out);
    }

    .music-home[data-state="open"] .meta-line {
      justify-content: flex-start;
    }

    .meta-line span {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
    }

    .meta-line span + span::before {
      content: "/";
      margin-right: 8px;
      color: var(--ink-faint);
    }

    .title-row {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 18px;
      transition: justify-content 520ms var(--ease-out);
    }

    .music-home[data-state="open"] .title-row {
      justify-content: space-between;
    }

    .title-copy {
      min-width: 0;
    }

    .artist {
      margin: 0 0 7px;
      color: var(--ink-soft);
      font-size: clamp(14px, 2vw, 16px);
      font-weight: 560;
    }

    .album-title {
      margin: 0;
      max-width: 12ch;
      font-family: Georgia, "Songti SC", "Noto Serif CJK SC", serif;
      font-size: clamp(42px, 9vw, 68px);
      font-weight: 520;
      letter-spacing: 0;
      line-height: 0.92;
    }

    .music-home[data-state="open"] .album-title {
      max-width: 12ch;
      font-size: clamp(40px, 8vw, 64px);
    }

    .description {
      margin: 0 auto;
      max-width: 36rem;
      color: var(--ink-soft);
      font-size: clamp(14px, 2vw, 16px);
      line-height: 1.72;
      transition: margin 520ms var(--ease-out);
      display: none;
    }

    .music-home[data-state="open"] .description {
      margin-left: 0;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(34px);
      transition:
        opacity 460ms ease,
        transform 620ms var(--ease-out),
        justify-content 520ms var(--ease-out);
    }

    .music-home[data-state="open"] .actions {
      justify-content: flex-end;
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
      transition-delay: 280ms;
    }

    .icon-button {
      position: relative;
      display: inline-grid;
      width: 56px;
      height: 56px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.56);
      box-shadow: 0 18px 44px rgba(55, 45, 31, 0.1);
      cursor: pointer;
      transition:
        transform 160ms var(--ease-out),
        border-color 180ms ease,
        background 180ms ease,
        color 180ms ease;
    }

    .icon-button:hover {
      border-color: rgba(21, 21, 21, 0.2);
      background: rgba(255, 255, 255, 0.86);
    }

    .icon-button:active {
      transform: scale(0.96);
    }

    .icon-button:focus-visible {
      outline: 3px solid rgba(21, 21, 21, 0.16);
      outline-offset: 3px;
    }

    .play-button {
      width: 64px;
      height: 64px;
      background: var(--ink);
      color: #fff9ed;
    }

    .play-button:hover {
      background: #0c0c0c;
      color: #fff9ed;
    }

    .save-button[aria-pressed="true"] {
      border-color: rgba(21, 21, 21, 0.24);
      color: var(--ink);
    }

    .icon {
      display: block;
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .pause-icon {
      display: none;
    }

    .play-button.is-playing .play-icon {
      display: none;
    }

    .play-button.is-playing .pause-icon {
      display: block;
    }

    .player-strip {
      display: grid;
      gap: 9px;
      margin-top: 2px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(34px);
      -webkit-backdrop-filter: blur(10px) saturate(1.04);
      backdrop-filter: blur(10px) saturate(1.04);
      transition: opacity 460ms ease, transform 620ms var(--ease-out);
    }

    .music-home[data-state="open"] .player-strip {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
      transition-delay: 340ms;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      color: var(--ink-soft);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .progress-bar {
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(21, 21, 21, 0.1);
    }

    .progress-fill {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: var(--ink);
      transition: width 120ms linear;
    }

    .status-text {
      min-height: 17px;
      color: var(--ink-soft);
      font-size: 12px;
    }

    .track-list {
      display: grid;
      gap: 8px;
      margin: clamp(20px, 3vw, 26px) 0 0;
      padding: 0;
      list-style: none;
      opacity: 0;
      pointer-events: none;
      transform: translateY(46px);
      transition: opacity 500ms ease, transform 700ms var(--ease-out);
    }

    .music-home[data-state="open"] .track-list {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
      transition-delay: 430ms;
    }

    .track-item {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 420ms ease, transform 560ms var(--ease-out);
    }

    .music-home[data-state="open"] .track-item {
      opacity: 1;
      transform: translateY(0);
    }

    .music-home[data-state="open"] .track-item:nth-child(1) { transition-delay: 520ms; }
    .music-home[data-state="open"] .track-item:nth-child(2) { transition-delay: 565ms; }
    .music-home[data-state="open"] .track-item:nth-child(3) { transition-delay: 610ms; }
    .music-home[data-state="open"] .track-item:nth-child(4) { transition-delay: 655ms; }
    .music-home[data-state="open"] .track-item:nth-child(5) { transition-delay: 700ms; }

    .track-button {
      display: grid;
      width: 100%;
      min-height: 58px;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: color 180ms ease, border-color 180ms ease;
    }

    .track-button:hover,
    .track-button:focus-visible {
      color: var(--ink);
      border-color: rgba(21, 21, 21, 0.22);
      outline: none;
    }

    .track-number {
      color: var(--ink-faint);
      font-size: 12px;
      letter-spacing: 0.14em;
    }

    .track-copy {
      min-width: 0;
    }

    .track-title {
      display: block;
      overflow-wrap: anywhere;
      font-size: 15px;
      font-weight: 650;
      line-height: 1.25;
    }

    .track-note {
      display: block;
      margin-top: 3px;
      color: var(--ink-soft);
      font-size: 12px;
      line-height: 1.35;
    }

    .track-duration {
      color: var(--ink-soft);
      font-size: 12px;
      white-space: nowrap;
    }

    .track-item.is-current .track-number,
    .track-item.is-current .track-title {
      color: var(--ink);
    }

    .track-item.is-current .track-button {
      border-color: rgba(21, 21, 21, 0.28);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes unwrap-cover {
      0% {
        transform: translateZ(0) scale(1) rotateZ(0deg) rotateY(0deg);
      }
      8% {
        transform: translateZ(0) scale(0.982) rotateZ(0deg) rotateY(0deg);
      }
      14% {
        transform: translateZ(0) scale(1.006) rotateZ(0deg) rotateY(0deg);
      }
      52% {
        transform: translateZ(30px) scale(1.011) rotateZ(-1.2deg) rotateY(5.2deg);
      }
      72% {
        transform: translateZ(36px) scale(1.012) rotateZ(-1.5deg) rotateY(7deg);
      }
      90% {
        transform: translateZ(18px) scale(1.006) rotateZ(0.42deg) rotateY(-2deg);
      }
      100% {
        transform: translateZ(0) scale(1) rotateZ(0deg) rotateY(0deg);
      }
    }

    @keyframes cover-shadow {
      0% {
        box-shadow:
          0 24px 74px rgba(60, 49, 35, 0.18),
          0 3px 0 rgba(255, 255, 255, 0.8) inset,
          0 0 0 1px rgba(21, 21, 21, 0.08);
      }
      8% {
        box-shadow:
          0 14px 42px rgba(60, 49, 35, 0.14),
          0 2px 0 rgba(255, 255, 255, 0.7) inset,
          0 0 0 1px rgba(21, 21, 21, 0.08);
      }
      75% {
        box-shadow:
          0 38px 104px rgba(60, 49, 35, 0.28),
          0 3px 0 rgba(255, 255, 255, 0.8) inset,
          0 0 0 1px rgba(21, 21, 21, 0.08);
      }
      100% {
        box-shadow:
          0 28px 82px rgba(60, 49, 35, 0.22),
          0 3px 0 rgba(255, 255, 255, 0.72) inset,
          0 0 0 1px rgba(21, 21, 21, 0.09);
      }
    }

    @keyframes shell-lift {
      0% {
        transform: translateY(0);
      }
      62% {
        transform: translateY(clamp(-44px, -5.8vh, -31px));
      }
      82% {
        transform: translateY(clamp(-31px, -4.1vh, -21px));
      }
      100% {
        transform: translateY(clamp(-36px, -4.8vh, -24px));
      }
    }

    @keyframes film-top-lift {
      0% {
        opacity: 0.58;
        transform: translate3d(0, 0, 0);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }
      18% {
        opacity: 0.66;
        transform: translate3d(0, -1.5%, 0);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }
      34% {
        clip-path: polygon(0 0, 100% 0, 100% 92%, 56% 100%, 52% 99%, 48% 100%, 0 92%);
      }
      58% {
        opacity: 0.44;
        transform: translate3d(0, -14%, 0);
        clip-path: polygon(0 0, 100% 0, 100% 78%, 54% 100%, 50% 99%, 46% 100%, 0 78%);
      }
      100% {
        opacity: 0;
        transform: translate3d(0, -56%, 0);
        clip-path: polygon(0 0, 100% 0, 100% 62%, 0 62%);
      }
    }

    @keyframes film-bottom-lift {
      0% {
        opacity: 0.58;
        transform: translate3d(0, 0, 0);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }
      18% {
        opacity: 0.66;
        transform: translate3d(0, 1.5%, 0);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }
      34% {
        clip-path: polygon(0 8%, 48% 0, 52% 1%, 56% 0, 100% 8%, 100% 100%, 0 100%);
      }
      58% {
        opacity: 0.44;
        transform: translate3d(0, 14%, 0);
        clip-path: polygon(0 22%, 46% 0, 50% 1%, 54% 0, 100% 22%, 100% 100%, 0 100%);
      }
      100% {
        opacity: 0;
        transform: translate3d(0, 56%, 0);
        clip-path: polygon(0 38%, 100% 38%, 100% 100%, 0 100%);
      }
    }

    @keyframes seal-open {
      0% {
        opacity: 1;
        transform: translate3d(0, -50%, 0);
        clip-path: inset(0 0 0 0);
      }
      24% {
        opacity: 0.96;
        clip-path: polygon(0 0, 100% 0, 100% 36%, 56% 50%, 52% 49%, 48% 51%, 0 64%);
      }
      46% {
        opacity: 0.72;
        clip-path: polygon(-2% 0, 102% 0, 102% 24%, 58% 50%, 42% 50%, -2% 76%);
      }
      72% {
        opacity: 0.28;
        clip-path: polygon(44% 44%, 56% 44%, 56% 56%, 44% 56%);
      }
      100% {
        opacity: 0;
        transform: translate3d(0, -50%, 0);
        clip-path: polygon(50% 50%, 50% 50%, 50% 50%, 50% 50%);
        visibility: hidden;
      }
    }

    @media (max-width: 820px) {
      :root {
        --cover-size: min(78vw, 360px);
      }

      .music-home {
        padding-top: 48px;
        width: min(100% - 18px, 1040px);
        min-height: calc(100dvh - 18px);
        margin-block: 9px;
      }

      .content-column,
      .music-home[data-state="open"] .content-column {
        max-width: min(100%, var(--cover-size));
      }

      .title-row,
      .music-home[data-state="open"] .title-row {
        align-items: flex-start;
      }

      .music-home[data-state="open"] .title-row {
        gap: 14px;
      }

      .album-title,
      .music-home[data-state="open"] .album-title {
        font-size: clamp(38px, 12vw, 58px);
      }

      .description {
        max-width: 100%;
      }
    }

    @media (max-width: 460px) {
      .music-home {
        padding-inline: 14px;
      }

      .title-row {
        flex-direction: column;
        align-items: center;
      }

      .music-home[data-state="open"] .title-row {
        align-items: stretch;
      }

      .actions,
      .music-home[data-state="open"] .actions {
        justify-content: flex-start;
      }

      .track-button {
        grid-template-columns: 30px minmax(0, 1fr);
      }

      .track-duration {
        grid-column: 2;
        justify-self: start;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
        transition-delay: 0ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="music-home" data-state="wrapped">
    <section class="stage" aria-label="个人音乐主页">
      <div class="album-shell">
        <div class="cover-column">
          <button class="album-unwrapper" id="albumUnwrapper" type="button" aria-label="打开个人音乐播放页" aria-expanded="false">
            <span class="album-cover">
              <img id="coverImage" src="assets/背面是我-2000.jpg" alt="Midnight Signal 专辑封面" />
              <span class="plastic-shell" aria-hidden="true">
                <span class="plastic-film"></span>
                <span class="plastic-half plastic-half--top"></span>
                <span class="plastic-half plastic-half--bottom"></span>
                <span class="seal"></span>
              </span>
            </span>
          </button>
        </div>

        <div class="content-column">
          <section class="album-details" aria-label="专辑信息">
            <div class="meta-line" aria-label="播放列表信息">
              <span id="releaseDate">2026.05</span>
              <span id="trackCount">5 Tracks</span>
              <span id="totalDuration">00:21</span>
            </div>

            <div class="title-row">
              <div class="title-copy">
                <p class="artist" id="artistName">Marcus</p>
                <h1 class="album-title" id="albumTitle">Midnight Signal</h1>
              </div>

              <div class="actions" aria-label="播放操作">
                <button class="icon-button play-button" id="playToggle" type="button" aria-label="播放当前曲目" title="播放/暂停" tabindex="-1">
                  <svg class="icon play-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8 5.6v12.8c0 .8.86 1.28 1.52.85l9.68-6.4a1 1 0 0 0 0-1.7L9.52 4.75A1 1 0 0 0 8 5.6Z"></path>
                  </svg>
                  <svg class="icon pause-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7 5.25C7 4.56 7.56 4 8.25 4h1.5c.69 0 1.25.56 1.25 1.25v13.5c0 .69-.56 1.25-1.25 1.25h-1.5C7.56 20 7 19.44 7 18.75V5.25Zm6 0C13 4.56 13.56 4 14.25 4h1.5c.69 0 1.25.56 1.25 1.25v13.5c0 .69-.56 1.25-1.25 1.25h-1.5c-.69 0-1.25-.56-1.25-1.25V5.25Z"></path>
                  </svg>
                </button>

                <button class="icon-button save-button" id="saveToggle" type="button" aria-label="收藏这个播放列表" aria-pressed="false" title="收藏" tabindex="-1">
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 20.4 10.68 19.2C5.88 14.86 2.7 11.98 2.7 8.45 2.7 5.57 4.96 3.3 7.82 3.3c1.62 0 3.17.76 4.18 1.95A5.48 5.48 0 0 1 16.18 3.3c2.86 0 5.12 2.27 5.12 5.15 0 3.53-3.18 6.41-7.98 10.76L12 20.4Z"></path>
                  </svg>
                </button>
              </div>
            </div>

            <p class="description" id="albumDescription">今晚的个人电台入口。先拆开这张封套，再进入一组短歌和 Voice DJ 片段。</p>

            <div class="player-strip" aria-label="播放进度">
              <div class="time-row"><span id="elapsedTime">00:00</span><span id="remainingTime">00:00</span></div>
              <div class="progress-bar" aria-hidden="true"><span class="progress-fill" id="progressFill"></span></div>
              <div class="status-text" id="statusText">Ready when opened.</div>
            </div>
          </section>

          <ol class="track-list" id="trackList" aria-label="曲目列表"></ol>
        </div>
      </div>

      <section class="liquid-page" id="liquidPage" aria-label="Liquid glass visual scene" tabindex="-1">
        <iframe
          class="unicorn-scene"
          id="unicornScene"
          title="Liquid glass visual scene"
          width="768"
          height="1024"
          loading="eager"
          tabindex="-1"
        ></iframe>
      </section>
    </section>

    <audio id="audioPlayer" preload="metadata"></audio>
    <span class="sr-only" id="stateAnnouncer" aria-live="polite"></span>
  </main>

  <script>
    const radioConfig = {
      artist: 'Marcus',
      title: 'Midnight Signal',
      releaseDate: '2026.05',
      description: '今晚的个人电台入口。先拆开这张封套，再进入一组短歌和 Voice DJ 片段。',
      cover: 'assets/背面是我-2000.jpg',
      tracks: [
        {
          title: 'Opening Signal',
          note: 'Voice DJ prelude',
          src: '../output/slicer_opt/001.wav',
          duration: 4
        },
        {
          title: 'Room Light',
          note: 'Soft vocal cut',
          src: '../output/slicer_opt/014.wav',
          duration: 4
        },
        {
          title: 'Window Static',
          note: 'Night transition',
          src: '../output/slicer_opt/028.wav',
          duration: 4
        },
        {
          title: 'Low Frequency',
          note: 'Station ID',
          src: '../output/slicer_opt/048.wav',
          duration: 5
        },
        {
          title: 'Afterglow Note',
          note: 'Closing fragment',
          src: '../output/slicer_opt/056.wav',
          duration: 4
        }
      ]
    };

    const root = document.querySelector('.music-home');
    const albumUnwrapper = document.getElementById('albumUnwrapper');
    const coverImage = document.getElementById('coverImage');
    const artistName = document.getElementById('artistName');
    const albumTitle = document.getElementById('albumTitle');
    const albumDescription = document.getElementById('albumDescription');
    const releaseDate = document.getElementById('releaseDate');
    const trackCount = document.getElementById('trackCount');
    const totalDuration = document.getElementById('totalDuration');
    const trackList = document.getElementById('trackList');
    const audioPlayer = document.getElementById('audioPlayer');
    const playToggle = document.getElementById('playToggle');
    const saveToggle = document.getElementById('saveToggle');
    const elapsedTime = document.getElementById('elapsedTime');
    const remainingTime = document.getElementById('remainingTime');
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');
    const stateAnnouncer = document.getElementById('stateAnnouncer');
    const liquidPage = document.getElementById('liquidPage');
    const unicornScene = document.getElementById('unicornScene');
    const UNICORN_SCENE_URL = 'unicorn.html';
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const peelDuration = reduceMotion ? 60 : 1260;
    const restoreDuration = reduceMotion ? 90 : 1650;
    const openDuration = reduceMotion ? 110 : 1780;
    let currentTrackIndex = 0;
    let isOpen = false;
    let unicornSceneRequested = false;

    function formatTime(seconds) {
      const safeSeconds = Number.isFinite(seconds) && seconds > 0 ? seconds : 0;
      const minutes = Math.floor(safeSeconds / 60);
      const rest = Math.floor(safeSeconds % 60);
      return `${String(minutes).padStart(2, '0')}:${String(rest).padStart(2, '0')}`;
    }

    function totalSeconds() {
      return radioConfig.tracks.reduce((sum, track) => sum + track.duration, 0);
    }

    function currentTrack() {
      return radioConfig.tracks[currentTrackIndex];
    }

    function setConfigText() {
      artistName.textContent = radioConfig.artist;
      albumTitle.textContent = radioConfig.title;
      albumDescription.textContent = radioConfig.description;
      releaseDate.textContent = radioConfig.releaseDate;
      trackCount.textContent = `${radioConfig.tracks.length} Tracks`;
      totalDuration.textContent = formatTime(totalSeconds());
      coverImage.src = radioConfig.cover;
    }

    function renderTrackList() {
      trackList.innerHTML = '';

      radioConfig.tracks.forEach((track, index) => {
        const item = document.createElement('li');
        item.className = `track-item${index === currentTrackIndex ? ' is-current' : ''}`;

        const button = document.createElement('button');
        button.className = 'track-button';
        button.type = 'button';
        button.dataset.trackIndex = String(index);
        button.tabIndex = isOpen ? 0 : -1;
        button.setAttribute('aria-current', index === currentTrackIndex ? 'true' : 'false');
        button.setAttribute('aria-label', `播放 ${track.title}`);

        button.innerHTML = `
          <span class="track-number">${String(index + 1).padStart(2, '0')}</span>
          <span class="track-copy">
            <span class="track-title">${track.title}</span>
            <span class="track-note">${track.note}</span>
          </span>
          <span class="track-duration">${formatTime(track.duration)}</span>
        `;

        item.appendChild(button);
        trackList.appendChild(item);
      });
    }

    function setOpenControlsEnabled(enabled) {
      playToggle.tabIndex = enabled ? 0 : -1;
      saveToggle.tabIndex = enabled ? 0 : -1;
      trackList.setAttribute('aria-hidden', String(!enabled));
      trackList.querySelectorAll('button').forEach((button) => {
        button.tabIndex = enabled ? 0 : -1;
      });
    }

    function updateCurrentTrackUI() {
      [...trackList.children].forEach((item, index) => {
        const isCurrent = index === currentTrackIndex;
        item.classList.toggle('is-current', isCurrent);
        const button = item.querySelector('button');
        button.setAttribute('aria-current', isCurrent ? 'true' : 'false');
      });

      const track = currentTrack();
      statusText.textContent = audioPlayer.paused ? `Selected: ${track.title}` : `Playing: ${track.title}`;
      remainingTime.textContent = formatTime(track.duration);
    }

    function loadTrack(index) {
      currentTrackIndex = index;
      const track = currentTrack();
      audioPlayer.src = track.src;
      audioPlayer.load();
      elapsedTime.textContent = '00:00';
      remainingTime.textContent = formatTime(track.duration);
      progressFill.style.width = '0%';
      updateCurrentTrackUI();
    }

    function fitUnicornScene() {
      if (!unicornScene) return;
    }

    function initUnicornScene() {
      if (unicornSceneRequested) {
        fitUnicornScene();
        return;
      }

      unicornSceneRequested = true;
      fitUnicornScene();

      if (window.location.protocol === 'file:') {
        window.location.assign(UNICORN_SCENE_URL);
        return;
      }

      if (!unicornScene) {
        return;
      }

      unicornScene.addEventListener('error', () => {
        stateAnnouncer.textContent = 'Liquid glass scene could not load.';
      }, { once: true });

      if (!unicornScene.src) {
        unicornScene.src = UNICORN_SCENE_URL;
      }
    }

    window.addEventListener('resize', fitUnicornScene);

    function openAlbum() {
      if (isOpen || root.dataset.state === 'peeling') {
        return;
      }

      root.classList.add('is-unwrapping');
      root.dataset.state = 'peeling';
      albumUnwrapper.setAttribute('aria-expanded', 'true');
      stateAnnouncer.textContent = '正在打开个人音乐播放页';

      window.setTimeout(() => {
        root.dataset.state = 'revealed';
        isOpen = true;
        statusText.textContent = `Selected: ${currentTrack().title}`;
        stateAnnouncer.textContent = '封面已拆封';
      }, peelDuration);

      window.setTimeout(() => {
        root.classList.remove('is-unwrapping');
      }, restoreDuration);

      window.setTimeout(() => {
        root.dataset.state = 'open';
        setOpenControlsEnabled(false);
        initUnicornScene();
        statusText.textContent = `Selected: ${currentTrack().title}`;
        stateAnnouncer.textContent = '个人音乐播放页已打开';
        liquidPage.focus({ preventScroll: true });
      }, openDuration);
    }

    async function playCurrentTrack() {
      try {
        await audioPlayer.play();
        playToggle.classList.add('is-playing');
        playToggle.setAttribute('aria-label', '暂停当前曲目');
        statusText.textContent = `Playing: ${currentTrack().title}`;
      } catch (error) {
        playToggle.classList.remove('is-playing');
        playToggle.setAttribute('aria-label', '播放当前曲目');
        statusText.textContent = 'Audio could not start in this browser.';
      }
    }

    function pauseCurrentTrack() {
      audioPlayer.pause();
      playToggle.classList.remove('is-playing');
      playToggle.setAttribute('aria-label', '播放当前曲目');
      statusText.textContent = `Paused: ${currentTrack().title}`;
    }

    albumUnwrapper.addEventListener('click', openAlbum);

    document.addEventListener('keydown', (event) => {
      const keyOpensAlbum = event.key === 'Enter' || event.key === ' ';
      const isTyping = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);

      if (!isOpen && keyOpensAlbum && !isTyping) {
        event.preventDefault();
        openAlbum();
      }
    });

    playToggle.addEventListener('click', () => {
      if (!isOpen) {
        openAlbum();
        return;
      }

      if (audioPlayer.paused) {
        playCurrentTrack();
      } else {
        pauseCurrentTrack();
      }
    });

    saveToggle.addEventListener('click', () => {
      const nextValue = saveToggle.getAttribute('aria-pressed') !== 'true';
      saveToggle.setAttribute('aria-pressed', String(nextValue));
      saveToggle.setAttribute('aria-label', nextValue ? '取消收藏这个播放列表' : '收藏这个播放列表');
    });

    trackList.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-track-index]');
      if (!button) {
        return;
      }

      const nextIndex = Number(button.dataset.trackIndex);
      const shouldKeepPlaying = !audioPlayer.paused;
      loadTrack(nextIndex);

      if (shouldKeepPlaying) {
        playCurrentTrack();
      } else {
        statusText.textContent = `Selected: ${currentTrack().title}`;
      }
    });

    audioPlayer.addEventListener('play', () => {
      playToggle.classList.add('is-playing');
      updateCurrentTrackUI();
    });

    audioPlayer.addEventListener('pause', () => {
      playToggle.classList.remove('is-playing');
      if (!audioPlayer.ended) {
        statusText.textContent = `Paused: ${currentTrack().title}`;
      }
    });

    audioPlayer.addEventListener('ended', () => {
      playToggle.classList.remove('is-playing');
      statusText.textContent = `Finished: ${currentTrack().title}`;
      progressFill.style.width = '100%';
    });

    audioPlayer.addEventListener('timeupdate', () => {
      const fallbackDuration = currentTrack().duration;
      const duration = Number.isFinite(audioPlayer.duration) ? audioPlayer.duration : fallbackDuration;
      const progress = duration > 0 ? Math.min(audioPlayer.currentTime / duration, 1) : 0;

      elapsedTime.textContent = formatTime(audioPlayer.currentTime);
      remainingTime.textContent = formatTime(Math.max(duration - audioPlayer.currentTime, 0));
      progressFill.style.width = `${progress * 100}%`;
    });

    audioPlayer.addEventListener('loadedmetadata', () => {
      const duration = Number.isFinite(audioPlayer.duration) ? audioPlayer.duration : currentTrack().duration;
      remainingTime.textContent = formatTime(duration);
    });

    audioPlayer.addEventListener('error', () => {
      playToggle.classList.remove('is-playing');
      statusText.textContent = 'Audio file is unavailable.';
    });

    setConfigText();
    renderTrackList();
    setOpenControlsEnabled(false);
    loadTrack(0);
  </script>
</body>
</html>
