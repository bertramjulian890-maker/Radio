<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Midnight Signal abstract album cover</title>
  <desc id="desc">A dark square album cover with warm signal bands, vinyl rings, and radio wave forms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#181512"/>
      <stop offset="0.48" stop-color="#31241e"/>
      <stop offset="1" stop-color="#090908"/>
    </linearGradient>
    <radialGradient id="amber" cx="68%" cy="24%" r="46%">
      <stop offset="0" stop-color="#ffc477" stop-opacity="0.92"/>
      <stop offset="0.32" stop-color="#d05f39" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#070706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="green" cx="24%" cy="76%" r="52%">
      <stop offset="0" stop-color="#7a9b73" stop-opacity="0.72"/>
      <stop offset="0.38" stop-color="#384f3b" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#070706" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.2"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="round">
      <rect width="1200" height="1200" rx="88"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="1200" fill="url(#bg)"/>
    <rect width="1200" height="1200" fill="url(#amber)"/>
    <rect width="1200" height="1200" fill="url(#green)"/>
    <g opacity="0.28" stroke="#f8e7c7" fill="none">
      <circle cx="600" cy="600" r="112" stroke-width="3"/>
      <circle cx="600" cy="600" r="206" stroke-width="2"/>
      <circle cx="600" cy="600" r="318" stroke-width="1.6"/>
      <circle cx="600" cy="600" r="430" stroke-width="1.2"/>
    </g>
    <g opacity="0.42" stroke="#f8e7c7" stroke-linecap="round" fill="none">
      <path d="M144 616 C 236 516, 304 712, 392 610 S 552 506, 640 612 S 802 724, 890 610 S 1010 526, 1062 594" stroke-width="10"/>
      <path d="M158 662 C 246 580, 308 744, 392 660 S 552 572, 646 662 S 808 742, 898 660 S 1016 584, 1052 642" stroke-width="4"/>
    </g>
    <g opacity="0.28" fill="#f8e7c7">
      <rect x="148" y="202" width="184" height="6" rx="3"/>
      <rect x="148" y="224" width="88" height="6" rx="3"/>
      <rect x="866" y="946" width="184" height="6" rx="3"/>
      <rect x="962" y="968" width="88" height="6" rx="3"/>
    </g>
    <g opacity="0.18" stroke="#f8e7c7" stroke-width="1">
      <path d="M0 300H1200"/>
      <path d="M0 600H1200"/>
      <path d="M0 900H1200"/>
      <path d="M300 0V1200"/>
      <path d="M600 0V1200"/>
      <path d="M900 0V1200"/>
    </g>
    <rect width="1200" height="1200" filter="url(#grain)" opacity="0.42"/>
    <rect x="34" y="34" width="1132" height="1132" rx="66" fill="none" stroke="#fff1d4" stroke-opacity="0.18" stroke-width="2"/>
  </g>
</svg>
